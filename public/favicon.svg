<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Notebook page background -->
  <rect x="4" y="2" width="22" height="28" rx="2" ry="2" fill="#fdf8f0" stroke="#e8dcc8" stroke-width="1.2"/>
  <!-- Left spine -->
  <rect x="4" y="2" width="4" height="28" rx="2" ry="2" fill="#c45e1a"/>
  <!-- Ruled lines -->
  <line x1="10" y1="10" x2="24" y2="10" stroke="#e8dcc8" stroke-width="0.8"/>
  <line x1="10" y1="14" x2="24" y2="14" stroke="#e8dcc8" stroke-width="0.8"/>
  <line x1="10" y1="18" x2="24" y2="18" stroke="#e8dcc8" stroke-width="0.8"/>
  <line x1="10" y1="22" x2="24" y2="22" stroke="#e8dcc8" stroke-width="0.8"/>
  <!-- Pen / pencil diagonally across -->
  <rect x="18" y="3" width="5" height="16" rx="1" ry="1" fill="#3a7d4a" transform="rotate(35 20 10)"/>
  <polygon points="23,22 25,26 21,24" fill="#2d2318" transform="rotate(35 20 10) translate(-1 0)"/>
  <rect x="18" y="3" width="5" height="2.5" rx="0.8" fill="#f5cfaa" transform="rotate(35 20 10)"/>
</svg>
